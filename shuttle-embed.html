<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Space Shuttle Explorer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;600;700&display=swap');

  :root{
    --cab-dark: #1a1024;
    --cab-mid: #2b1a3d;
    --cab-edge: #3d2557;
    --neon-cyan: #4fe3ff;
    --neon-pink: #ff4fd8;
    --neon-yellow: #ffd54f;
    --neon-green: #4fff9e;
    --screen-bg: #05070f;
    --text: #eae6f5;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    height:100%;
    overflow:hidden;
    background:
      radial-gradient(circle at 20% 10%, #3d2557 0%, transparent 45%),
      radial-gradient(circle at 85% 90%, #1e3a5f 0%, transparent 50%),
      var(--cab-dark);
    color:var(--text);
    font-family:'Rubik', 'Segoe UI', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:1.5vh 1.5vw;
  }

  .cabinet{
    width:min(1040px, 97vw);
    height:100%;
    max-height:97vh;
    background:linear-gradient(160deg, var(--cab-mid), var(--cab-dark));
    border-radius:22px;
    padding:14px 14px 16px;
    border:3px solid var(--cab-edge);
    box-shadow:
      0 0 0 6px #120a1a,
      0 0 40px rgba(79,227,255,.15),
      0 25px 60px rgba(0,0,0,.55);
    position:relative;
    display:flex;
    flex-direction:column;
    min-height:0;
  }

  /* corner rivets */
  .rivet{
    position:absolute;
    width:12px;height:12px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #6a5487, #241633);
    box-shadow: inset 0 0 3px rgba(0,0,0,.6);
    z-index:2;
  }
  .rivet.tl{ top:10px; left:10px; }
  .rivet.tr{ top:10px; right:10px; }
  .rivet.bl{ bottom:10px; left:10px; }
  .rivet.br{ bottom:10px; right:10px; }

  /* Top nav bar, arcade-marquee style */
  .marquee{
    flex:0 0 auto;
    display:grid;
    grid-template-columns: 1fr auto 1fr;
    align-items:center;
    gap:10px;
    padding:8px 14px;
    border-radius:14px;
    background:linear-gradient(180deg, #241633, #150c1f);
    border:1px solid #4a2f68;
    margin-bottom:10px;
  }
  .nav-btn{
    background:#2f1d44;
    border:1px solid #5a3a7d;
    color:var(--neon-cyan);
    font-family:'Press Start 2P', monospace;
    font-size:10px;
    padding:8px 11px;
    border-radius:8px;
    cursor:pointer;
    letter-spacing:.5px;
    white-space:nowrap;
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .nav-btn:hover{
    transform:translateY(-1px);
    box-shadow:0 0 12px rgba(79,227,255,.5);
  }
  .nav-btn:active{ transform:translateY(0); }

  .title-block{
    text-align:center;
    justify-self:center;
    grid-column:2;
  }
  .title-block h1{
    font-family:'Press Start 2P', monospace;
    font-size:clamp(13px, 2.4vw, 19px);
    margin:0;
    color:var(--neon-yellow);
    text-shadow:
      0 0 6px rgba(255,213,79,.7),
      2px 2px 0 #7a4a00;
    letter-spacing:1px;
    white-space:nowrap;
  }

  #prevBtn{ grid-column:1; justify-self:start; }
  #nextBtn{ grid-column:3; justify-self:end; }

  /* Screen bezel around the iframe -- flexes to fill remaining height */
  .screen-bezel{
    flex:1 1 auto;
    min-height:0;
    background:#0c0714;
    border-radius:14px;
    padding:8px;
    border:1px solid #4a2f68;
    box-shadow: inset 0 0 25px rgba(0,0,0,.6);
    display:flex;
  }
  .screen{
    flex:1 1 auto;
    min-height:0;
    position:relative;
    border-radius:8px;
    overflow:hidden;
    background:var(--screen-bg);
    box-shadow: 0 0 0 2px #000, 0 0 30px rgba(79,227,255,.12) inset;
  }
  .screen::after{
    /* subtle scanline overlay for arcade feel */
    content:"";
    position:absolute;
    inset:0;
    pointer-events:none;
    background:repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.02) 0px,
      rgba(255,255,255,0.02) 1px,
      transparent 2px,
      transparent 3px
    );
    mix-blend-mode:overlay;
    z-index:1;
  }
  iframe.activity-frame{
    width:100%;
    height:100%;
    border:0;
    display:block;
  }

  /* HUD row: badges + continue */
  .hud-row{
    flex:0 0 auto;
    margin-top:10px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    padding:0 4px;
  }

  .badge-strip{
    display:flex;
    gap:7px;
    flex-wrap:wrap;
  }
  .badge{
    width:30px;height:30px;
    border-radius:8px;
    background:#241633;
    border:2px solid #4a2f68;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:13px;
    color:#5a4a72;
    position:relative;
    transition:all .25s ease;
  }
  .badge.unlocked{
    background:radial-gradient(circle at 35% 30%, #2a4a3a, #16231c);
    border-color:var(--neon-green);
    color:var(--neon-green);
    box-shadow:0 0 10px rgba(79,255,158,.5);
    animation:badgePop .35s ease;
  }
  @keyframes badgePop{
    0%{ transform:scale(.6); }
    60%{ transform:scale(1.15); }
    100%{ transform:scale(1); }
  }

  .xp-block{
    display:flex;
    align-items:center;
    gap:9px;
    font-family:'Press Start 2P', monospace;
    font-size:9px;
    color:var(--neon-cyan);
  }
  .xp-bar{
    width:130px;
    height:11px;
    background:#1a1024;
    border:2px solid #4a2f68;
    border-radius:6px;
    overflow:hidden;
  }
  .xp-fill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg, var(--neon-pink), var(--neon-cyan));
    transition:width .4s ease;
  }

  .continue-btn{
    font-family:'Press Start 2P', monospace;
    font-size:10px;
    padding:10px 16px;
    border-radius:9px;
    border:none;
    background:#3a2952;
    color:#6a5a80;
    cursor:not-allowed;
    letter-spacing:.5px;
    white-space:nowrap;
    transition:all .2s ease;
  }
  .continue-btn.ready{
    cursor:pointer;
    background:linear-gradient(135deg, var(--neon-pink), #b23aa8);
    color:#1a1024;
    box-shadow:0 0 16px rgba(255,79,216,.6);
    animation:pulseReady 1.4s ease-in-out infinite;
  }
  @keyframes pulseReady{
    0%,100%{ box-shadow:0 0 12px rgba(255,79,216,.5); }
    50%{ box-shadow:0 0 22px rgba(255,79,216,.85); }
  }
  .continue-btn.ready:hover{ transform:translateY(-1px); }

  .toast{
    position:fixed;
    bottom:20px;
    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:linear-gradient(135deg, #241633, #150c1f);
    border:1px solid var(--neon-yellow);
    color:var(--neon-yellow);
    font-family:'Press Start 2P', monospace;
    font-size:10px;
    padding:14px 22px;
    border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.5), 0 0 18px rgba(255,213,79,.4);
    opacity:0;
    pointer-events:none;
    transition:opacity .3s ease, transform .3s ease;
    z-index:50;
    text-align:center;
  }
  .toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
  }

  @media (max-width:640px){
    .marquee{ grid-template-columns:1fr; justify-items:center; gap:8px; }
    #prevBtn{ grid-column:1; justify-self:center; order:2; }
    #nextBtn{ grid-column:1; justify-self:center; order:3; }
    .title-block{ grid-column:1; order:1; }
    .xp-bar{ width:100px; }
    .badge{ width:26px; height:26px; font-size:11px; }
  }
</style>
</head>
<body>

<div class="cabinet">
  <span class="rivet tl"></span>
  <span class="rivet tr"></span>
  <span class="rivet bl"></span>
  <span class="rivet br"></span>

  <div class="marquee">
    <button class="nav-btn" id="prevBtn" type="button">&#9664; PREV</button>
    <div class="title-block">
      <h1>SPACE SHUTTLE EXPLORER</h1>
    </div>
    <button class="nav-btn" id="nextBtn" type="button">NEXT &#9654;</button>
  </div>

  <div class="screen-bezel">
    <div class="screen">
      <iframe
        class="activity-frame"
        id="shuttleFrame"
        src="shuttle-interactive.html"
        title="Space Shuttle Orbiter interactive exploration"
        allow="fullscreen"
        loading="lazy">
      </iframe>
    </div>
  </div>

  <div class="hud-row">
    <div class="badge-strip" id="badgeStrip">
      <div class="badge" data-key="cockpit" title="Flight Deck & Cockpit">&#128187;</div>
      <div class="badge" data-key="payload" title="Payload Bay">&#128230;</div>
      <div class="badge" data-key="wing" title="Delta Wings">&#9992;</div>
      <div class="badge" data-key="tail" title="Vertical Stabilizer">&#9700;</div>
      <div class="badge" data-key="oms" title="OMS Pods">&#128293;</div>
      <div class="badge" data-key="engines" title="Main Engines">&#128640;</div>
      <div class="badge" data-key="tiles" title="Thermal Tiles">&#128737;</div>
    </div>

    <div class="xp-block">
      XP <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div> <span id="xpLabel">0/7</span>
    </div>

    <button class="continue-btn" id="continueBtn" type="button" disabled>NEXT STAGE &#9654;</button>
  </div>
</div>

<div class="toast" id="toast">MISSION COMPLETE!</div>

<script>
  const xpFill = document.getElementById('xpFill');
  const xpLabel = document.getElementById('xpLabel');
  const continueBtn = document.getElementById('continueBtn');
  const toast = document.getElementById('toast');
  const badges = document.querySelectorAll('.badge');

  window.addEventListener('message', (event) => {
    const data = event.data;
    if (!data || typeof data !== 'object') return;

    if (data.type === 'shuttle-interactive-progress') {
      const pct = (data.visited / data.total) * 100;
      xpFill.style.width = pct + '%';
      xpLabel.textContent = data.visited + '/' + data.total;
      if (Array.isArray(data.keys)) {
        badges.forEach(b => {
          if (data.keys.indexOf(b.dataset.key) !== -1) {
            b.classList.add('unlocked');
          }
        });
      }
    }

    if (data.type === 'shuttle-interactive-complete') {
      continueBtn.disabled = false;
      continueBtn.classList.add('ready');
      toast.textContent = 'MISSION COMPLETE!';
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  });

  continueBtn.addEventListener('click', () => {
    if (continueBtn.disabled) return;
    toast.textContent = 'LOADING NEXT STAGE...';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2400);
  });

  document.getElementById('prevBtn').addEventListener('click', () => {
    toast.textContent = 'PREVIOUS STAGE (DEMO)';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  });
  document.getElementById('nextBtn').addEventListener('click', () => {
    toast.textContent = 'NEXT STAGE (DEMO)';
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2000);
  });
</script>

</body>
</html>
